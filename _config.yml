description: Політика конфіденційності
Ця політика конфіденційності застосовується до мобільного застосунку Rusoriz Runner, а також до будь-яких пов’язаних із ним послуг, що надаються Валентином Руденком (разом – «Застосунок»). Валентин Руденко цим документом іменується «Постачальник послуг».


Збір та використання інформації
Додаток збирає інформацію, коли ви його завантажуєте та використовуєте. Ця інформація може включати таку інформацію, як

Адреса інтернет-протоколу вашого пристрою
Сторінки Додатку, які ви відвідуєте, час і дата вашого відвідування, час, проведений на цих сторінках
Час, витрачений на роботу з заявкою
ваша мобільна операційна система, яку ви використовуєте

Файли cookie та технології відстеження
Додаток або його сторонні SDK можуть використовувати файли cookie, SDK, пікселі та аналогічні технології для підтримки функціональності, аналітики або надання послуг. Там, де це вимагається чинним законодавством, Постачальник послуг отримає згоду перед використанням необов'язкових технологій відстеження.


Ваші права
Ви можете запросити доступ до ваших персональних даних, що зберігаються Постачальником послуг, їх виправлення або видалення. Щоб скористатися цими правами або відкликати згоду, якщо обробка здійснюється на основі згоди, зверніться до Постачальника послуг за адресою valglamurchik@gmail.com.


Ваші права на конфіденційність у Каліфорнії (CCPA/CPRA)
Якщо ви є резидентом Каліфорнії, ви маєте право знати, яка персональна інформація збирається, право видаляти персональну інформацію, право відмовитися від продажу або поширення персональної інформації та право на недискримінацію для здійснення цих прав. Щоб скористатися своїми правами CCPA/CPRA, зверніться до Постачальника послуг за адресою valglamurchik@gmail.com.

Постачальник послуг може використовувати надану вами інформацію для надсилання важливої ​​інформації, необхідних повідомлень та, де це дозволено законом, маркетингових повідомлень.


Для кращого користування Додатком Постачальник послуг може вимагати від вас надання певної особистої інформації. Інформація, яку запитує Постачальник послуг, буде збережена та використана, як описано в цій політиці конфіденційності.


Доступ третіх сторін
Лише агреговані, анонімізовані дані періодично передаються зовнішнім службам, щоб допомогти Постачальнику послуг покращити Додаток та свої послуги. Постачальник послуг може передавати вашу інформацію третім сторонам у спосіб, описаний у цій заяві про конфіденційність.


Міжнародна передача даних
Постачальник послуг або його сторонні постачальники послуг можуть передавати персональні дані до країн за межами вашої країни проживання, зокрема за межі Європейської економічної зони (ЄЕЗ). Там, де чинне законодавство вимагає гарантій для міжнародної передачі, Постачальник послуг використовуватиме відповідні механізми.

Стандартні договірні положення (СДК), затверджені Європейською комісією
Рішення щодо адекватності або інші юридично визнані механізми передачі
Ваша згода, де це необхідно та дозволено законом
Закони про захист даних в інших країнах можуть відрізнятися від законів вашої юрисдикції. Там, де це вимагається законом, Постачальник послуг застосує відповідні запобіжні заходи та отримає будь-яку згоду, необхідну для передачі даних.


Зверніть увагу, що Додаток використовує сторонні сервіси, які мають власну Політику конфіденційності щодо обробки даних. Нижче наведено посилання на Політику конфіденційності сторонніх постачальників послуг, послугами яких користується Додаток:

AdMob

Постачальник послуг може розголошувати надану Користувачем та автоматично зібрану інформацію:

як того вимагає закон, наприклад, для виконання повістки до суду або аналогічної юридичної процедури;
коли вони добросовісно вважають, що розкриття інформації необхідне для захисту їхніх прав, захисту вашої безпеки або безпеки інших осіб, розслідування шахрайства або відповіді на запит уряду;
зі своїми довіреними постачальниками послуг, які працюють від їхнього імені, не використовують незалежно інформацію, яку їм розкриває Постачальник послуг, і погодилися дотримуватися правил, викладених у цій заяві про конфіденційність.

Права на відмову
Ви можете зупинити подальший збір інформації з вашого мобільного пристрою, видаливши Додаток. Видалення зупинить збір даних з вашого пристрою Додатком, але воно не видаляє автоматично інформацію, яка вже була передана Постачальнику послуг або третім особам.

Щоб подати запит на видалення ваших персональних даних, відкликати згоду або скористатися будь-яким зі своїх прав, зверніться до Постачальника послуг за адресою valglamurchik@gmail.com.


Політика зберігання даних
Постачальник послуг зберігає персональні дані на підставі їхньої необхідності для заявлених цілей:

Дані, надані користувачем: зберігаються протягом усього періоду використання вами Додатку та 12 місяців після цього, якщо закон не вимагає довшого зберігання.
Автоматично зібрані дані: зберігаються до 24 місяців з моменту збору, якщо тільки для дотримання законодавства не потрібне довше зберігання.
Агреговані та анонімізовані дані: зберігаються необмежений термін, оскільки вони більше не ідентифікують вашу особу
Дані, необхідні для дотримання законодавства: зберігаються протягом терміну, передбаченого чинним законодавством
Ви можете вимагати видалення ваших персональних даних, за умови дотримання будь-яких юридичних зобов’язань щодо їх зберігання. Якщо ви хочете, щоб Постачальник послуг видалив Дані, надані Користувачем, подані через Додаток, зв’яжіться з ним за адресою valglamurchik@gmail.com. Зверніть увагу, що деякі Дані, надані Користувачем, можуть знадобитися для належного функціонування Додатку.


Діти
Додаток не призначений для дітей віком до 16 років або для дітей старшого віку, як того вимагає чинне законодавство. Постачальник послуг свідомо не збирає дані від дітей та не пропонує їм Додаток.


Якщо згідно з чинним законодавством потрібна згода батьків або опікунів, Додаток не призначений для використання без такої згоди. Постачальник послуг свідомо не збирає персональну інформацію від дітей віком до 16 років, порушуючи чинне законодавство. У випадку, якщо Постачальник послуг виявить, що дитина надала персональну інформацію, Постачальник послуг негайно видалить її зі своїх серверів. Якщо ви є батьком або опікуном і вам відомо, що ваша дитина надала Постачальнику послуг персональну інформацію, зверніться до Постачальника послуг (valglamurchik@gmail.com), щоб він міг вжити необхідних заходів.


Безпека
Постачальник послуг стурбований захистом конфіденційності вашої інформації. Постачальник послуг забезпечує фізичні, електронні та процедурні гарантії для захисту інформації, яку обробляє та зберігає.


Повідомлення про порушення безпеки даних
Якщо станеться витік даних, який вплине на ваші персональні дані, Постачальник послуг повідомить вас відповідно до чинного законодавства, зокрема, за потреби, надасть інформацію про характер порушення та кроки, що вживаються для його усунення.


Зміни
Постачальник послуг може час від часу оновлювати цю Політику конфіденційності. Постачальник послуг повідомить вас про суттєві зміни, опублікувавши оновлену Політику конфіденційності з датою набрання чинності. У випадках, передбачених законодавством, Постачальник послуг запитає вашу згоду на суттєві зміни, перш ніж вони набудуть чинності.


Попередні версії цієї Політики конфіденційності будуть підтримуватися та надаватися за запитом, звернувшись до Постачальника послуг за адресою valglamurchik@gmail.com.


Ця політика конфіденційності діє з 25.09.2026


Ваша згода
Якщо обробка здійснюється на основі згоди, ви надаєте цю згоду, ствердно погоджуючись на відповідну функцію або дію. Ви можете відкликати згоду в будь-який час, не впливаючи на обробку, здійснену до відкликання. Обробка на інших законних підставах здійснюється, як описано вище.


Зв'яжіться з нами
Якщо у вас виникнуть будь-які питання щодо конфіденційності під час використання Додатку або щодо практик, зверніться до Постачальника послуг електронною поштою за адресою valglamurchik@gmail.com.
